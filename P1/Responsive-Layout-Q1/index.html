
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBite - Canteen Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CampusBite</h1>
        <header>Fresh Food, Happy Campus!</header>
    </header>

    <nav>
        <a href="#menu">Menu</a>
        <a href="#specials">Specials</a>
        <a href="#contact">Contact</a>
    </nav>

    <main class="container">

        <section class="special" id="specials">
            <h2>Today's Special</h2>
            <img src="https://placehold.co/600x300?text=Special+Burger"
                 width="600" height="300"
                 alt="Today's special burger">
            <p>Cheese Burger - ₹99</p>
        </section>

        <section id="menu">
            <h2>Our Menu</h2>

            <div class="menu-grid">

                <div class="card">
                    <img src="https://placehold.co/400x250?text=Pizza"
                         width="400" height="250" alt="Pizza">
                    <h3>Pizza</h3>
                    <p>₹120</p>
                </div>

                <div class="card">
                    <img src="https://placehold.co/400x250?text=Burger"
                         width="400" height="250" alt="Burger">
                    <h3>Burger</h3>
                    <p>₹80</p>
                </div>

                <div class="card">
                    <img src="https://placehold.co/400x250?text=Sandwich"
                         width="400" height="250" alt="Sandwich">
                    <h3>Sandwich</h3>
                    <p>₹60</p>
                </div>

                <div class="card">
                    <img src="https://placehold.co/400x250?text=Pasta"
                         width="400" height="250" alt="Pasta">
                    <h3>Pasta</h3>
                    <p>₹100</p>
                </div>

                <div class="card">
                    <img src="https://placehold.co/400x250?text=French+Fries"
                         width="400" height="250" alt="French Fries">
                    <h3>French Fries</h3>
                    <p>₹50</p>
                </div>

                <div class="card">
                    <img src="https://placehold.co/400x250?text=Cold+Coffee"
                         width="400" height="250" alt="Cold Coffee">
                    <h3>Cold Coffee</h3>
                    <p>₹70</p>
                </div>

            </div>
        </section>

    </main>

    <footer id="contact">
        <p>Contact: campusbite@example.com</p>
        <p>&copy; 2026 CampusBite. All Rights Reserved.</p>
    </footer>

</body>
</html>
